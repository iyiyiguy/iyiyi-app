plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bodyhit'
version = '1.0.0'

// Surface scanner model (Laser Tag cover), SHIPPED INSIDE THE APP: the official MiDaS v2.1 small
// TFLite release asset (66 MB, not kept in git) is downloaded at build time into
// build/generated/depthModel/assets/bodyhit-depth/, checked against its pinned size + SHA-256
// (a mismatch FAILS the build), and that folder is an assets source of this library, so AGP
// merges it into the app's assets (APK and AAB; it is ABI-independent, so it sits in the base
// module once, not per ABI split). DepthEstimator.kt memory-maps it from there.
// No network at build time: a warning, and the app is built without it (DepthEstimator then
// falls back to its silent runtime download). The verified file is cached in the Gradle user
// home, so later builds (and `clean`) don't download it again. -PbodyhitSkipDepthModel skips it.
def depthModelUrl = 'https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite'
def depthModelSize = 66338288L
def depthModelSha256 = '93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd'
def depthModelAssetsDir = new File(layout.buildDirectory.get().asFile, 'generated/depthModel/assets')
def depthModelFile = new File(depthModelAssetsDir, 'bodyhit-depth/midas_v21_small_256.tflite')
def depthModelCache = new File(gradle.gradleUserHomeDir, "caches/bodyhit-depth/${depthModelSha256}.tflite")
def depthModelSkip = project.hasProperty('bodyhitSkipDepthModel')

def sha256Of = { File f ->
  def md = java.security.MessageDigest.getInstance('SHA-256')
  f.withInputStream { input ->
    byte[] buf = new byte[1 << 20]
    int n
    while ((n = input.read(buf)) > 0) {
      md.update(buf, 0, n)
    }
  }
  return md.digest().collect { String.format('%02x', it & 0xff) }.join('')
}

def fetchDepthModel = tasks.register('fetchDepthModel') {
  description = 'Downloads and verifies the bundled surface scanner model (MiDaS v2.1 small TFLite).'
  inputs.property('sha256', depthModelSha256)
  outputs.dir(depthModelAssetsDir)
  // Re-run while the model is missing (e.g. the last build had no network).
  outputs.upToDateWhen { depthModelSkip || (depthModelFile.isFile() && depthModelFile.length() == depthModelSize) }
  doLast {
    depthModelAssetsDir.mkdirs()
    if (depthModelSkip) {
      return
    }
    if (depthModelFile.isFile() && depthModelFile.length() == depthModelSize) {
      return
    }
    depthModelFile.parentFile.mkdirs()
    if (depthModelCache.isFile() && depthModelCache.length() == depthModelSize && sha256Of(depthModelCache) == depthModelSha256) {
      java.nio.file.Files.copy(depthModelCache.toPath(), depthModelFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      return
    }
    def part = new File(depthModelFile.path + '.part')
    def downloaded = false
    def lastError = null
    for (int attempt = 1; attempt <= 3 && !downloaded; attempt++) {
      part.delete()
      try {
        logger.lifecycle("[BodyHit] downloading surface scanner model (${depthModelSize} bytes) from ${depthModelUrl}")
        def conn = new URL(depthModelUrl).openConnection()
        conn.connectTimeout = 30000
        conn.readTimeout = 60000
        conn.instanceFollowRedirects = true
        conn.setRequestProperty('Accept-Encoding', 'identity')
        if (conn.responseCode != 200) {
          throw new IOException("HTTP ${conn.responseCode}")
        }
        conn.inputStream.withStream { input -> part.withOutputStream { out -> out << input } }
        downloaded = true
      } catch (Exception e) {
        lastError = e
        part.delete()
        if (attempt < 3) {
          Thread.sleep(5000L * attempt)
        }
      }
    }
    if (!downloaded) {
      logger.warn("[BodyHit] WARNING: could not download ${depthModelUrl} (${lastError}): building WITHOUT the bundled surface scanner model (the app will download it at runtime instead)")
      return
    }
    def gotSize = part.length()
    def gotSha = sha256Of(part)
    if (gotSize != depthModelSize || gotSha != depthModelSha256) {
      part.delete()
      throw new GradleException("[BodyHit] surface scanner model FAILED VERIFICATION: expected ${depthModelSize} bytes, sha256 ${depthModelSha256}; " +
        "got ${gotSize} bytes, sha256 ${gotSha} (from ${depthModelUrl}). Refusing to bundle it.")
    }
    if (!part.renameTo(depthModelFile)) {
      throw new GradleException("[BodyHit] could not write ${depthModelFile}")
    }
    try {
      depthModelCache.parentFile.mkdirs()
      java.nio.file.Files.copy(depthModelFile.toPath(), depthModelCache.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    } catch (Exception ignored) {
      // The cache is only an optimisation.
    }
  }
}

android {
  namespace "expo.modules.bodyhit"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main {
      assets.srcDirs += depthModelAssetsDir
    }
  }
  // Stored uncompressed so it can be memory-mapped. AGP 8.12 already leaves .tflite uncompressed
  // in the APK and the AAB (BundleConfig uncompressed glob); this keeps it so for this library,
  // and DepthEstimator.kt copies the asset out once if a build ever compresses it.
  androidResources {
    noCompress 'tflite'
  }
}

// Everything that reads this library's assets runs after the model is in place.
tasks.named('preBuild').configure { dependsOn fetchDepthModel }
tasks.matching { it.name ==~ /(merge|package)\w*Assets/ }.configureEach { dependsOn fetchDepthModel }

dependencies {
  // On-device face detection (model bundled in the app, works offline, no Play Services needed).
  implementation 'com.google.mlkit:face-detection:16.1.7'
  // On-device body pose (Laser Tag hit detection), model bundled in the app.
  implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
  // Surface scanner (Laser Tag cover): LiteRT, the TensorFlow Lite runtime (org.tensorflow.lite.Interpreter;
  // 16 KB page-aligned native libs). The depth model itself ships in the app's assets (fetchDepthModel above).
  implementation 'com.google.ai.edge.litert:litert:1.4.2'
}
