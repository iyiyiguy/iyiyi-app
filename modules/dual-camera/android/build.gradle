plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dualcamera'
version = '1.0.0'

android {
  namespace "expo.modules.dualcamera"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same CameraX version expo-camera uses, so there's only one copy in the app.
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.core:core-ktx:1.13.1"
  // ProcessCameraProvider.getInstance() returns a Guava ListenableFuture (same pin as expo-camera).
  implementation "com.google.guava:listenablefuture:1.0"
}

// Full Guava (from React Native) swaps listenablefuture for an empty stub; force the real one,
// exactly like expo-camera does.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}
