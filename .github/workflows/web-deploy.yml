# Website (iyiyi.xyz) + web app (app.iyiyi.xyz) on Cloudflare Pages. Runs on a free Linux runner.
#   web/site/          -> Pages project "iyiyi-site"  (custom domain iyiyi.xyz)
#   expo export web    -> Pages project "iyiyi-app"   (custom domain app.iyiyi.xyz)
# Repo secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID.
name: Web → Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'modules/**/ios/**', 'modules/**/android/**']

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://sqsjwcsrgcgcpxccxedp.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dC1TtQAqZpdQWRMoLAa3-w_xCSbea1x
      EXPO_PUBLIC_API_URL: https://sqsjwcsrgcgcpxccxedp.supabase.co/functions/v1
      EXPO_PUBLIC_SENTRY_DSN: https://eb96181c8fd8d89f9a44ea2dec4b1277@o4512105727262720.ingest.us.sentry.io/4512105734864896
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch generated art
        run: |
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3IY98iu8iKHx88wWdcSrcv0jctc/hf_20261002_193716_
          fetch() { curl -fsSL --retry 3 -o "/tmp/$2" "$B$1.png" && python3 -c "import sys;d=open('/tmp/$2','rb').read(8);sys.exit(0 if d.startswith(b'\x89PNG') else 1)" && mv "/tmp/$2" "assets/game-covers/$2" || echo "::warning::kept placeholder for $2"; }
          fetch 81413a9a-73d8-4d5e-95ed-a4a8e85315b3 beside-them-penguins.png
          fetch a80f1f1c-de23-49c0-ad73-a82fc0fd1a5b battle-royale.png
          fetch 90dd4749-06d8-4ea4-97a8-21f228a48a51 chess.png

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build web app
        run: |
          npx expo export --platform web --output-dir dist-app
          cp web/app-redirects dist-app/_redirects
          ls dist-app

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create iyiyi-site --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages project create iyiyi-app --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy web/site --project-name=iyiyi-site --branch=main --commit-dirty=true
          npx --yes wrangler@4 pages deploy dist-app --project-name=iyiyi-app --branch=main --commit-dirty=true

      - name: No Cloudflare secrets yet
        if: env.HAS_CF != 'true'
        run: echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy. Built only."

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist-app
            web/site
