# Creates / updates the Google Play products (scripts/play_products.py): Pro subscription,
# guns, UAV packs and grenades. Runs when the script changes, or by hand.
# Signs in to Google without a key (Workload Identity Federation for this repo only).
name: Google Play products

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/play_products.py', '.github/workflows/play-products.yml']

permissions:
  contents: read
  id-token: write

jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER || 'projects/642174796559/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT || 'play-publisher@project-bdce1459-401b-43ec-803.iam.gserviceaccount.com' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - run: python scripts/play_products.py
